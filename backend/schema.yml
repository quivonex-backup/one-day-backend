components:
  schemas:
    AdminActivateUserRequest:
      type: object
      properties:
        user_id:
          type: integer
      required:
      - user_id
    AdminDeactivateUserRequest:
      type: object
      properties:
        user_id:
          type: integer
      required:
      - user_id
    AdminUserDetailRequest:
      type: object
      properties:
        user_id:
          type: integer
      required:
      - user_id
    AdminUserListRequest:
      type: object
      properties:
        search:
          type: string
        role:
          type: string
        is_active:
          type: boolean
        is_email_verified:
          type: boolean
        is_mobile_verified:
          type: boolean
        page:
          type: integer
        page_size:
          type: integer
    BlankEnum:
      enum:
      - ''
    EducationLevel:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        name:
          type: string
          maxLength: 100
        display_order:
          type: integer
          maximum: 4294967295
          minimum: 0
          format: int64
      required:
      - created_at
      - id
      - name
      - updated_at
    EmploymentType:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        name:
          type: string
          maxLength: 100
      required:
      - created_at
      - id
      - name
      - updated_at
    ExperienceLevel:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        name:
          type: string
          maxLength: 100
        min_year:
          type: integer
          maximum: 4294967295
          minimum: 0
          format: int64
        max_year:
          type: integer
          maximum: 4294967295
          minimum: 0
          format: int64
          nullable: true
        display_order:
          type: integer
          maximum: 4294967295
          minimum: 0
          format: int64
      required:
      - created_at
      - id
      - name
      - updated_at
    ForgotPassword:
      type: object
      properties:
        email:
          type: string
          format: email
      required:
      - email
    GenderEnum:
      enum:
      - MALE
      - FEMALE
      - OTHER
      type: string
      description: |-
        * `MALE` - Male
        * `FEMALE` - Female
        * `OTHER` - Other
    JobCategory:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        name:
          type: string
          maxLength: 100
      required:
      - created_at
      - id
      - name
      - updated_at
    JobType:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        name:
          type: string
          maxLength: 100
        description:
          type: string
      required:
      - created_at
      - id
      - name
      - updated_at
    Language:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        name:
          type: string
          maxLength: 100
      required:
      - created_at
      - id
      - name
      - updated_at
    Location:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        taluka_name:
          type: string
          readOnly: true
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        name:
          type: string
          maxLength: 150
        pincode:
          type: string
          nullable: true
          maxLength: 6
        taluka:
          type: integer
      required:
      - created_at
      - id
      - name
      - taluka
      - taluka_name
      - updated_at
    Login:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          writeOnly: true
        role:
          $ref: '#/components/schemas/RoleEnum'
      required:
      - email
      - password
      - role
    LoginSuccessResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          $ref: '#/components/schemas/LoginTokenData'
      required:
      - data
      - message
      - success
    LoginTokenData:
      type: object
      properties:
        access:
          type: string
        refresh:
          type: string
        role:
          type: string
        email:
          type: string
          format: email
      required:
      - access
      - email
      - refresh
      - role
    Logout:
      type: object
      properties:
        refresh:
          type: string
      required:
      - refresh
    Profile:
      type: object
      properties:
        full_name:
          type: string
          maxLength: 150
        profile_picture:
          type: string
          format: uri
          nullable: true
        gender:
          oneOf:
          - $ref: '#/components/schemas/GenderEnum'
          - $ref: '#/components/schemas/BlankEnum'
        date_of_birth:
          type: string
          format: date
          nullable: true
        email:
          type: string
          format: email
          readOnly: true
        mobile_number:
          type: string
          readOnly: true
        role:
          type: string
          readOnly: true
      required:
      - email
      - mobile_number
      - role
    Register:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        mobile_number:
          type: string
          maxLength: 15
        role:
          $ref: '#/components/schemas/RoleEnum'
        password:
          type: string
          writeOnly: true
          minLength: 8
        confirm_password:
          type: string
          writeOnly: true
      required:
      - confirm_password
      - email
      - mobile_number
      - password
      - role
    RegisterSuccessResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
      required:
      - message
      - success
    ResendOTP:
      type: object
      properties:
        email:
          type: string
          format: email
      required:
      - email
    ResetPassword:
      type: object
      properties:
        email:
          type: string
          format: email
        otp:
          type: string
          maxLength: 6
        password:
          type: string
          writeOnly: true
          minLength: 8
        confirm_password:
          type: string
          writeOnly: true
      required:
      - confirm_password
      - email
      - otp
      - password
    RoleEnum:
      enum:
      - ADMIN
      - EMPLOYER
      - EMPLOYEE
      type: string
      description: |-
        * `ADMIN` - Admin
        * `EMPLOYER` - Employer
        * `EMPLOYEE` - Employee
    Skill:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        name:
          type: string
          maxLength: 100
      required:
      - created_at
      - id
      - name
      - updated_at
    VerifyOTP:
      type: object
      properties:
        email:
          type: string
          format: email
        otp:
          type: string
          maxLength: 6
          minLength: 6
      required:
      - email
      - otp
    VerifyResetOTP:
      type: object
      properties:
        email:
          type: string
          format: email
        otp:
          type: string
          maxLength: 6
          minLength: 6
      required:
      - email
      - otp
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
